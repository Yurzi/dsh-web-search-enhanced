name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== "v" + pkg.version) throw new Error("Release tag does not match package version")'

      - name: Check types, build, tests and packed contract
        run: pnpm run check

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance
