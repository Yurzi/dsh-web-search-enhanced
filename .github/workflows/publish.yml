name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm run check
      # prepublishOnly would repeat the check above.
      - run: pnpm publish --access public --no-git-checks --provenance --ignore-scripts
