# Bundle patch layered over the shipped base profile: take the native
# web_search provider's seat in place.
#
# The plugin registers its provider as `deepseek-official`, the id the shipped
# `web` row already selects with `searchProvider: deepseek-official`, so the
# shared `web` row is left untouched. A patch replaces a row's whole config:
# rewriting `searchProvider` alone would drop `fetchProvider: http` and leave
# web_fetch to auto-selection, breaking fetch plugins such as
# dsh-web-fetch-enhanced that rely on the shipped selection.
#
# DeepSeek Messages search registers the same id, so its row is disabled. Its
# role is covered by this plugin's DeepSeek and model connections; disabling it
# also hides the built-in Web search settings page, whose switch rewrites `web`
# in the user layer. `web-deepseek-api` stays mounted: both selections remain
# pinned, so its providers are reached only when a user selects them, and its
# `deepseek-fetch-api` belongs to web_fetch, not to this plugin.
- id: web-search-deepseek
  disabled: true

- insert:
    - id: web-search-enhanced
      name: dsh-web-search-enhanced
      config:
        # Zero-key default for new Sessions; never replaces a saved selection.
        defaultConnection: builtin:exa
